name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: televip-lsposed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.3-telegram13-${{ github.run_number }}
          name: TeleVip v3.6.3 (Telegram 13.x support)
          body: |
            TeleVip LSPosed module with Telegram 13.x support.

            - Supports Telegram 13.0.1 (71679) and 12.8.3 (69222)
            - Core features verified: Ghost Mode, Hide Seen/Typing, Show Deleted Messages, Local Premium, Download Boost
            - See README for full 13.x compatibility notes
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
